services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    ports:
      - "8096:8096"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ./media:/media:ro
    restart: unless-stopped
    networks:
      - kairos-network

networks:
  kairos-network:
    driver: bridge

volumes:
  jellyfin_config:
  jellyfin_cache:
